project: helloworld
env-files:
  - .env.local
  - .env
homepage: http://localhost:${BACKEND_PORT}/health
ports:
  - BACKEND_PORT
  - FRONTEND_PORT
native:
  backend:
    cmd: pnpm --filter @mp-lb/helloworld-backend dev
    env: "*"
  frontend:
    cmd: pnpm --filter @mp-lb/helloworld-frontend dev --host 0.0.0.0 --port ${FRONTEND_PORT}
    env: "*"
tasks:
  scripts:
    cmds:
      - pnpm exec tsx packages/scripts/index.ts
  scripts-test:
    cmds:
      - pnpm --filter @mp-lb/helloworld-scripts test
  augment-docs-site:
    cmds:
      - pnpm exec tsx packages/scripts/augmentDocsSite.ts {{REST}}
  publish-packages:
    cmds:
      - pnpm exec tsx packages/scripts/autoPublish.ts {{REST}}
  verify-publication:
    cmds:
      - pnpm exec tsx packages/scripts/verifyPublication.ts {{REST}}
  context-build:
    cmds:
      - pnpm exec tsx packages/scripts/contextFiles.ts build {{REST}}
  context-copy:
    cmds:
      - pnpm exec tsx packages/scripts/contextFiles.ts copy {{REST}}
  compile-agents:
    cmds:
      - zap task context-build -- {{REST}}
  setup:
    cmds:
      - pnpm install
  build:
    cmds:
      - pnpm build
  lint:
    cmds:
      - |
        if [ -n "{{REST}}" ]; then
          pnpm exec eslint {{REST}}
        else
          pnpm lint
        fi
  check:
    cmds:
      - zap task lint -- {{REST}}
      - pnpm typecheck
  typecheck:
    cmds:
      - pnpm typecheck
  test:
    cmds:
      - pnpm test
  worktree-setup:
    cmds:
      - pnpm install
      - cp "$(dirname "$(git rev-parse --path-format=absolute --git-common-dir)")/.env" . 2>/dev/null || true
      - '[ ! -f AGENTS.base.md ] || zap task context-copy'
      - grep -qxF '@AGENTS_WORKTREE.md' AGENTS.md || printf '\n@AGENTS_WORKTREE.md\n' >> AGENTS.md
